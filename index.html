    nell:['The table nearest the fire rocks. Your aunt put a love letter under the short leg.','Cedric stares at the door every time it opens. He says he is checking the weather.','Oren paid with exact change. A man who counts everything is hiding a total.','The bead is not round. I like it better that way.','Boats are expensive. Apparently the water is included.','Sometimes all you can do is put the right cup in front of someone.','The room feels a little less empty than it did on Monday.'],

const Sim = (()=>{
 const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const obstacles=[...DATA.walls,...DATA.furniture];
 function blocked(x,y,r=11){return x<47+r||x>941-r||y<47+r||y>615-r||obstacles.some(o=>x>o.x-r&&x<o.x+o.w+r&&y>o.y-r&&y<o.y+o.h+r)}
 function line(a,b){let d=dist(a,b);for(let i=0;i<=d;i+=6){let t=i/(d||1),x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;if(DATA.walls.some(o=>x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h))return false}return true}
 function route(a,b){const step=20,key=(x,y)=>x+','+y;
  const nearest=p=>{let points=[];for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){let x=Math.round(p.x/step)+dx,y=Math.round(p.y/step)+dy;if(!blocked(x*step,y*step))points.push({x,y})}return points.sort((u,v)=>Math.hypot(u.x*step-p.x,u.y*step-p.y)-Math.hypot(v.x*step-p.x,v.y*step-p.y))[0]};
  let goal=nearest(b),start=nearest(a);if(!goal||!start)return [];let q=[start],seen=new Map([[key(start.x,start.y),null]]),last=null;
  for(let h=0;h<q.length;h++){let n=q[h];if(n.x===goal.x&&n.y===goal.y){last=n;break}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let x=n.x+dx,y=n.y+dy,k=key(x,y);if(!seen.has(k)&&!blocked(x*step,y*step)){seen.set(k,n);q.push({x,y})}}}
  if(!last)return [];let out=[];while(last){out.unshift({x:last.x*step,y:last.y*step});last=seen.get(key(last.x,last.y))}return out;
 }
 function fresh(){return {version:1,day:1,time:0,coins:24,debt:0,player:{x:250,y:320,name:'Keeper',color:'#d6ab5f',carry:null,path:[]},npcs:DATA.npcs.map((n,i)=>({...n,x:480+i*4,y:597,present:false,path:[],memory:[],known:[],familiar:0,served:0,away:false,state:'arriving'})),knowledge:{},heard:{},events:{},relationships:{'cedric:mira':'trusting','cedric:bram':'apprentice and mentor','cedric:nell':'tentative fondness'},world:{trade:'Wagons avoid Rookcross',leak:false,sold:false,exploited:false,guard:'No complaint filed'},staff:{hired:false,reports:[]},quest:null,notes:[],evidence:[],paused:false,ended:false,settings:{clear:false,slow:false},pour:0,toast:'',toastTime:0}}
 function note(s,t){s.notes.unshift({day:s.day,text:t});s.notes=s.notes.slice(0,50)}
 function say(s,t){s.toast=t;s.toastTime=7}
 function learn(s,id,source,channel='heard',confirmed=false){let k=s.knowledge[id];if(!k)k=s.knowledge[id]={id,observations:[],knownBy:['keeper'],status:DATA.rumors[id].kind};if(!k.observations.some(o=>o.source===source)){k.observations.push({source,origin:source.includes('recalling ')?source.split('recalling ')[1]:source,channel,day:s.day});if(new Set(k.observations.map(o=>o.origin||o.source)).size>1)k.status='Corroborated';}if(confirmed)k.status='Confirmed evidence';return k}
 function npc(s,id){return s.npcs.find(n=>n.id===id)}
 function activeTalks(s){return DATA.talks.filter(t=>t.days.includes(s.day)&&s.time>=t.start&&s.time<t.end&&npc(s,t.a).present&&npc(s,t.b).present&&!npc(s,t.a).away&&!npc(s,t.b).away).filter(t=>dist(npc(s,t.a),npc(s,t.b))<145)}
 function perceive(s,t,observer=s.player){let a=npc(s,t.a),d=dist(observer,a),visible=line(observer,a);let familiar=observer===s.player?a.familiar:0;let near=(t.whisper?75:118)+(s.settings.clear?30:0)+Math.min(15,familiar*3);if(!visible)return {tier:0};if(d<near)return {tier:3};if(d<near+70)return {tier:2};if(d<340)return {tier:1};return {tier:0}}
 function move(n,dt,speed=65){if(!n.path?.length)return;let p=n.path[0],d=dist(n,p),v=speed*dt;if(d<=v){n.x=p.x;n.y=p.y;n.path.shift()}else{n.x+=(p.x-n.x)/d*v;n.y+=(p.y-n.y)/d*v}}
 function target(n,p){if(!n.goal||dist(n.goal,p)>12){n.goal={...p};n.path=route(n,p)}}
 function resetDay(s){for(let n of s.npcs){n.present=false;n.served=0;n.path=[];n.goal=null;n.x=480;n.y=597} s.heard={};s.events['room'+s.day]=false}
 function nextDay(s){if(s.paused)return false;if(s.day===7){s.ended=true;s.paused=true;return true}s.coins-=s.staff.hired?7:4;if(s.coins<0){s.debt+=-s.coins;s.coins=0;note(s,'Oren covered the shortfall. He called it a favor, not a loan.')}s.day++;s.time=0;resetDay(s);note(s,'Morning: '+DATA.dayNames[s.day-1]+'.');return true}
 function resolve(s){let q=s.quest;if(!q||q.resolved||s.day<q.returnDay)return;q.resolved=true;const safe=q.bram&&q.supplies&&q.warning&&q.cautious;q.outcome=safe?(s.world.leak?'compromised':'proof'):'injured';for(let id of q.party){let n=npc(s,id);n.away=false;n.present=false;n.goal=null;n.memory.push(q.outcome==='injured'?'You sent us onto a broken road without enough preparation.':'You made sure we had a way home.')}s.relationships['cedric:bram']=q.bram?'Bram brought Cedric home':'Cedric wishes Bram had come';if(q.outcome==='injured')s.relationships['cedric:mira']=s.world.leak?'Cedric feels betrayed':'Mira worries for Cedric';}
 function tick(s,dt,input={}){if(s.paused||s.ended)return;dt=Math.min(dt,.1);s.time+=dt/(s.settings.slow?1.7:1);s.toastTime=Math.max(0,s.toastTime-dt);let dx=(input.right?1:0)-(input.left?1:0),dy=(input.down?1:0)-(input.up?1:0);if(dx||dy){s.player.path=[];let l=Math.hypot(dx,dy),v=155*dt;if(!blocked(s.player.x+dx/l*v,s.player.y))s.player.x+=dx/l*v;if(!blocked(s.player.x,s.player.y+dy/l*v))s.player.y+=dy/l*v}else move(s.player,dt,155);
  resolve(s);
  for(let n of s.npcs){if(n.away){if(n.present){target(n,{x:480,y:599});move(n,dt,78);if(dist(n,{x:480,y:599})<20)n.present=false}continue}if(s.time>=n.arrival&&s.time<n.depart&&!n.present&&!s.events['left'+s.day+n.id]){n.present=true;n.x=n.id==='mira'?915:480;n.y=n.id==='mira'?220:597;n.goal=null}
   if(!n.present)continue;if(s.time>=n.depart){target(n,{x:480,y:599});if(dist(n,{x:480,y:599})<20){n.present=false;s.events['left'+s.day+n.id]=true;continue}}
   else {let base=DATA.npcs.find(v=>v.id===n.id),p={x:base.x,y:base.y};let talk=DATA.talks.find(t=>t.days.includes(s.day)&&s.time>=t.start-8&&s.time<t.end&&(t.a===n.id||t.b===n.id));if(talk){let host=DATA.npcs.find(v=>v.id===talk.a);p={x:Math.min(910,host.x+(talk.b===n.id?65:0)),y:host.y}}
    if(n.id==='mira'&&s.world.leak&&s.day>=3)p={x:775,y:230};
    if(n.id==='nell'&&s.staff.hired){let guest=s.npcs.find(g=>g.present&&!g.away&&!g.served&&g.id!=='nell'&&g.x<710&&s.time>30);if(guest){p={x:guest.x-28,y:guest.y};if(dist(n,guest)<45){guest.served=1;s.coins+=3;n.state='serving'}}else p={x:245,y:265}}
    target(n,p)}move(n,dt);n.state=n.path.length?'walking':n.served?'drinking':'seated';
  }
  for(let t of activeTalks(s)){let p=perceive(s,t),h=s.heard[t.id]||(s.heard[t.id]={dwell:0,learned:false});if(p.tier===3){h.dwell+=dt;if(h.dwell>=3&&!h.learned){h.learned=true;if(t.rumor)learn(s,t.rumor,npc(s,t.a).name,'overheard')}}else h.dwell=Math.max(0,h.dwell-dt*.5);
