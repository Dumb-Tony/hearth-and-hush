body {

button,

}
button {

  padding: 9px 13px;

}
button:hover,
button:focus-visible {
  background: #596457;
  outline: 2px solid #d6af67;
}
button:disabled {
  opacity: 0.4;
  cursor: default;
}
header {
  max-width: 1260px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 17px 24px;
  gap: 15px;
}
h1 {
  font-size: 26px;
  font-weight: normal;
  letter-spacing: 2px;
  margin: 0;
}
small,
.eyebrow {
  font: 11px system-ui;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #b8b6a3;
}
.status {
  font: 14px system-ui;
  color: #d8c7a8;
  text-align: center;
}
.tools {
  display: flex;
  gap: 7px;
}
.tools button {
  font: 13px system-ui;
}
main {
  max-width: 1260px;
  margin: auto;
  padding: 0 20px;
}
#stage {
  position: relative;
  border: 1px solid #546057;
  border-radius: 9px;
  overflow: hidden;
  box-shadow: 0 18px 65px #0008;
  background: #192427;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
}
#caption {
  position: absolute;
  bottom: 17px;
  left: 20%;
  right: 20%;

  background: #16201fec;

  border-radius: 6px;
  text-align: center;
  font-size: 17px;
  line-height: 1.45;

}
#toast {
  min-height: 38px;

  text-align: center;
  font-size: 16px;
}
footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font: 13px system-ui;
  color: #b7c0b6;
  padding: 5px 0 20px;
}
kbd {
  color: #f3ddb3;

  padding: 2px 5px;

#overlay {
  position: fixed;
  inset: 0;
  background: #061012c9;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
  z-index: 3;

#panel {
  background: #202c2b;
  border: 1px solid #8b927b;
  border-radius: 12px;

  overflow: auto;
  box-shadow: 0 30px 100px #000a;
  padding: 28px;
}
#panel h2 {
  font-size: 32px;
  font-weight: normal;
  margin: 8px 0 14px;
  color: #efdbac;
}
#panel h3 {
  font-size: 20px;
  font-weight: normal;
  color: #e5ca93;
}
#panel p {
  line-height: 1.6;
  color: #d0d6c9;
}
#panel .actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 20px;
}
#panel input[type="text"] {
  width: 100%;
  background: #122020;
  border: 1px solid #67786c;
  color: #eee3cd;
  border-radius: 4px;
  padding: 10px;
  margin: 7px 0;
}
#panel label {
  display: block;
  line-height: 1.7;
  margin: 10px 0;
  color: #d1d7cc;
}
#panel article {
  border-top: 1px solid #566157;
  padding: 10px 0;
}
#panel .muted {
  font: 13px system-ui;
  color: #a9b8ac;
  line-height: 1.6;
}
.tag {
  font: 11px system-ui;
  letter-spacing: 1px;
  color: #debd7e;
  text-transform: uppercase;
}
.primary {
  background: #ad8746;
  color: #122120;
  border-color: #dcba76;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
#touch {
  display: none;
}
.pauseFlag {
  color: #efd19a;
}
@media (max-width: 750px) {
  header {
    padding: 12px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 20px;
  }
  main {
    padding: 0 5px;
  }
  .tools {
    gap: 3px;
  }
  .tools button {
    padding: 7px;
  }
  #caption {
    left: 6%;
    right: 6%;
    font-size: 13px;
    bottom: 8px;
  }
  footer {
    font-size: 11px;
    flex-wrap: wrap;
  }
  #panel {
    padding: 20px;
  }
  .grid {
    grid-template-columns: 1fr;
  }
  #touch {
    display: block;
    position: absolute;
    right: 10px;
    bottom: 10px;
  }
  #toast {
    font-size: 13px;
  }
}

  min-width: 0;

#toast {
  font-size: 14px;

  padding-top: 12px;

footer {
  font-size: 11px;

// Player-facing choices name the information or action explicitly. Neutral
// conversation exits never count as refusing a request or sharing a secret.
const Dialogue = {
  personalNote(n) {
    return {
      cedric:
        "Cedric told me he is paying for his sister’s glassmaking apprenticeship.",
      mira: "Mira told me she is saving enough to leave the people she works for.",
      nell: "Nell told me she wants to buy a small boat.",
      oren: "Oren told me he needs the shipments to pay his drivers and feed his horses.",
      tomas: "Tomas told me he needs evidence he can use in his report.",
      aldous: "Aldous asked for blankets and food for families at the chapel.",
      bram: "Bram told me he wants to keep Cedric safe while he learns.",
      ivo: "Ivo told me he found the inn in three old treaties. He wants to know why people met here.",
    }[n.id];
  },
  choices(s, n) {
    const options = [];
    const add = (verb, label, detail, disabled = false) =>
      options.push({ verb, label, detail, disabled });
    if (n.id === "mira" && s.knowledge.wagons && !s.world.leak) {
      add(
        "share",
        "Tell Mira about the missing wagons",
        "I will tell Mira what I know. She may tell other people.",
      );
      add(
        "withhold",
        "Don't tell Mira about the wagons",
        "I will tell Mira I am keeping this information private.",
      );
    }
    if (n.id === "oren") {
      if (s.knowledge.wagons && !s.world.sold) {
        add(
          "sell",
          "Sell Oren my wagon information · 15 coins",
          "Oren will pay me 15 coins for my information about the missing wagons.",
        );
        add(
          "withhold",
          "Don't sell Oren the information",
          "I will refuse Oren’s offer, keep my information and receive no payment.",
        );
      }
      if (s.knowledge.ledger && !s.world.exploited)
        add(
          "exploit",
          "Demand 25 coins to keep the ledger secret",
          "I will threaten to expose Oren’s payments unless he pays me. He will remember this.",
        );
    }
    if (n.id === "nell") {
      if (!s.staff.hired)
        add(
          "hire",
          "Hire Nell · 12 coins",
          s.coins < 12
            ? "I need 12 coins to hire Nell. I will also owe her 3 coins per day."
            : "Nell will serve my public tables. I will pay her 3 coins per day.",
          s.coins < 12,
        );
      else
        add(
          "report",
          "Ask Nell what she overheard",
          "I will ask Nell to repeat conversations she was close enough to understand.",
        );
    }
    if (n.id === "cedric" && s.quest?.resolved && !s.quest.debriefed)
      add(
        "debrief",
        "Ask what happened on the expedition",
        "I will hear Cedric’s full account and inspect anything he brought back.",
      );
    if (n.id === "tomas") {
      if (s.events.search) {
        add(
          "cooperate",
          "Let Tomas search the inn",
          "I will give Tomas permission to search my inn for evidence.",
        );
        add(
          "withhold",
          "Refuse the search",
          "I will refuse Tomas permission to search my inn. He will record my refusal.",
        );
      }
      if (s.knowledge.ledger)
        add(
          "testify",
          "Give Tomas the ledger as evidence",
          "I will give Tomas the record of Oren’s payments.",
        );
    }
    return options;
  },
  line(s, n) {
    if (n.id === "mira" && s.world.leak)
      return "I asked my contacts about those wagons. I told them what you told me. I thought they could help.";
    if (n.id === "oren" && s.world.exploited)
      return "You have your money. Keep that ledger away from the watch. I will not forget this.";
    if (n.id === "oren" && s.world.sold)
      return "I paid you for that information about the wagons. Please do not pass it to the watch as well.";
    if (n.id === "tomas" && s.events.search)
      return "I am investigating the old tollhouse. May I search the inn for evidence? You can refuse, but I will record that in my report.";
    if (n.id === "cedric" && s.quest?.resolved)
      return (
        s.quest.returnLine ||
        "I am back from the tollhouse. Let me tell you what happened."
      );
    if (n.id === "bram" && n.familiar >= 2 && !s.quest?.resolved)
      return "The north bridge is rotten. Take rope and use the ridge path instead. If the crossing looks unsafe, turn back.";
    if (n.id === "tomas" && n.familiar >= 2)
      return "The wagon tracks turn toward the old tollhouse. I found no sign of a fight at the junction. I still need to find out why they went that way.";
    const def = DATA.npcs.find((d) => d.id === n.id);

      9,
      12,

}
function welcome() {
  state.paused = true;
  panel(
    `<div class="eyebrow">A seven-day innkeeper story • playable prototype</div><h2>The world goes out.<br>You stay behind.</h2><p>Your aunt left you a shabby inn at Rookcross, a little money, and a ledger full of names. Start with a drink. Stay close when someone lowers their voice.</p><div class="grid"><div><h3>Be present</h3><p><kbd>WASD</kbd> / arrows to walk, or click the floor. <kbd>E</kbd> to talk or interact. Hold E by a cask to pour; carry it to a guest.</p></div><div><h3>Listen and decide</h3><p>Nearby fragments become full conversations if you linger. Walls and whispers matter. <kbd>Space</kbd> pauses for thought; <kbd>J</kbd> opens your journal.</p></div></div><label>Your name<input id="keeperName" type="text" maxlength="24" value="${esc(state.player.name)}"></label><label>Coat <select id="coat"><option value="#d6ab5f">Ochre</option><option value="#7caaa0">River green</option><option value="#b68c9d">Heather</option></select></label><p class="muted">About 21 minutes. Autosaves on this browser. Quiet moments can pass unnoticed; important stories have more than one trail. No service timers. Desktop recommended.</p><div class="actions">${btn(state.time || state.day > 1 ? "Return to the inn" : "Unlock the door", "startGame()")}</div>`,
    "welcome",
  );
  $("coat").value = state.player.color;
}
function startGame() {
  state.player.name = $("keeperName").value.trim() || "Keeper";
  state.player.color = $("coat").value;
  state.paused = false;
  started = true;
  closePanel();
  if (state.ended) {
    state.paused = true;
    ending();
  }
  save();
}
function talk(id) {
  if (!doAct("talk", id)) return;
  const n = Sim.npc(state, id);
  const memories = n.memory
    .slice(-3)
    .map((t) => "<li>" + esc(t) + "</li>")
    .join("");
  const options = Dialogue.choices(state, n)
    .map(
      (o) =>
        '<div class="decision">' +
        btn(o.label, "choice('" + o.verb + "','" + id + "')", o.disabled) +
        "<p>" +
        esc(o.detail) +
        "</p></div>",
    )
    .join("");
  panel(
    '<div class="character-head"><canvas id="portrait" width="112" height="118" aria-hidden="true"></canvas><div><div class="eyebrow">' +
      esc(n.role) +
      "</div><h2>" +
      esc(n.name) +
      '</h2></div></div><div class="speech-label">' +
      esc(n.name) +
      ' says</div><p class="spoken">“' +
      esc(Dialogue.line(state, n)) +
      '”</p><details open class="person-notes"><summary>My notes about ' +
      esc(n.name) +
      "</summary><p>" +
      esc(Dialogue.personalNote(n)) +
      "</p>" +
      (n.familiar > 2
        ? '<p class="muted">Favorite order: ' + esc(n.favorite) + ".</p>"
        : "") +
      (memories ? "<h3>What I did</h3><ul>" + memories + "</ul>" : "") +
      '</details><div class="decisions">' +
      options +
      '</div><div class="actions">' +
      btn("End conversation", "closePanel()") +
      '</div><p class="muted">The inn stays busy while you talk. Press Space to pause and think. Ending this conversation does not share or refuse anything.</p>',
    "talk",
  );
  const pc = $("portrait").getContext("2d");
  pc.fillStyle = "#233c42";
  pc.beginPath();
  pc.arc(56, 58, 52, 0, Math.PI * 2);
  pc.fill();
  pc.save();
  pc.translate(-22, -15);
  pc.scale(1.4, 1.4);
  TavernArt.person(pc, { ...n, x: 56, y: 75, path: [], served: false });
  pc.restore();
}
function choice(v, id) {
  if (state.paused) return;
  doAct(v, id);
  closePanel();
}
function board() {
  let q = state.quest,
    letter = state.evidence.find((e) => e.id === "letter");
  if (letter) doAct("inspect", "letter");
  panel(
    `<div class="eyebrow">The office • hands beyond the inn</div><h2>Letters & departures</h2><p>${letter ? esc(letter.text) : "Your desk holds letters from travelers and a map of the roads around Rookcross."}</p>${q ? `<h3>Blackwood tollhouse</h3><p>${q.returnSeen || q.debriefed ? "You have seen Cedric back at the inn. Find him for the full story." : "Cedric" + (q.bram ? " and Bram" : "") + " left on day " + q.departDay + ". They expected two days on the road."}</p>` : `<h3>Survey the Blackwood tollhouse</h3><p>Ask Cedric to find the missing wagons. He is eager, but has never led a survey. A bridge on this road may be unsafe.</p><label><input id="bram" type="checkbox" checked> Ask Bram to accompany him · 6 coins</label><label><input id="supplies" type="checkbox" checked> Rope, provisions and dry blankets · 4 coins</label><label><input id="cautious" type="checkbox" checked> Survey cautiously; come home before taking risks</label><label><input id="warning" type="checkbox" ${state.knowledge.warning ? "checked" : "disabled"}> Share Bram's ridge-route warning ${state.knowledge.warning ? "" : "(not learned)"}</label><p class="muted">Cedric's fee: 8 coins. Both selected travelers must be in the inn. Depart by day four to allow a return this week.</p>${btn("Agree and send them", "dispatch()", !state.knowledge.wagons || state.day > 4)}`}
<div class="actions">${btn("Read journal", "journal()")}${btn("Back to the room", "closePanel()")}</div>`,
    "board",
  );
}
function dispatch() {
  if (state.paused) return;
  let opts = {};
  for (let id of ["bram", "supplies", "cautious", "warning"])
    opts[id] = $(id).checked;
  if (doAct("dispatch", null, opts)) closePanel();
}
function journal(filter = "") {
  panel(
    `<div class="eyebrow">${esc(state.player.name)}'s journal • inspection only</div><h2>What I know</h2><input id="search" type="text" placeholder="Search people, sources, rumors…" value="${esc(filter)}" oninput="filterJournal(this.value)"><div id="entries"></div><div class="actions">${btn("Back to the room", "closePanel()")}</div>`,
    "journal",
  );
  filterJournal(filter);
}
function filterJournal(filter) {
  let f = filter.toLowerCase(),
    entries = Object.values(state.knowledge).filter(
      (k) =>
        JSON.stringify(k).toLowerCase().includes(f) ||
        JSON.stringify(DATA.rumors[k.id]).toLowerCase().includes(f),
    );
  $("entries").innerHTML =
    entries
      .map(
        (k) =>
          `<article><span class="tag">${k.status}</span><h3>${DATA.rumors[k.id].title}</h3><p>${DATA.rumors[k.id].text}</p><p class="muted">${k.observations.map((o) => `Day ${o.day} • ${esc(o.source)} • ${o.channel}`).join("<br>")}<br>People I know have this information: ${[...new Set(k.knownBy)].map((n) => esc(n === "keeper" ? "Me" : n)).join(", ")}</p></article>`,
      )
      .join("") +
    (!entries.length
      ? "<p>No matching leads. My other notes are below.</p>"
      : "") +
    "<h3>People & choices</h3>" +
    state.notes
      .filter((n) => n.text.toLowerCase().includes(f))
      .map((n) => `<p class="muted">Day ${n.day} — ${esc(n.text)}</p>`)
      .join("") +
    Object.entries(state.observedRelationships)
      .filter(
        ([k, v]) =>
          (k + v).toLowerCase().includes(f) &&
          k.split(":").every((id) => Sim.npc(state, id).familiar > 0),
      )
      .map(
        ([k, v]) =>
          `<p class="muted">${esc(k.replace(":", " & "))}: ${esc(v)}</p>`,
      )
      .join("");
}
function settings() {
  panel(
    `<div class="eyebrow">Comfort & access</div><h2>Make yourself at home</h2><label><input type="checkbox" ${state.settings.clear ? "checked" : ""} onchange="state.settings.clear=this.checked"> Clearer conversation cues and a little more hearing range</label><label><input type="checkbox" ${state.settings.slow ? "checked" : ""} onchange="state.settings.slow=this.checked"> Longer days (the keeper still walks at the same pace)</label><div class="actions">${btn("Save now", "state.toast=save()?'Saved on this browser.':'Browser storage is unavailable.';state.toastTime=5;closePanel()")}${btn("New week", "confirmReset()")}${btn("Back", "closePanel()")}</div><p class="muted">Pause freely with Space. No actions can be issued while paused. This prototype contains no essential audio cues.</p>`,
    "settings",
  );
}
function confirmReset() {
  panel(
    '<h2>Begin again?</h2><p>This replaces the saved week in this browser.</p><div class="actions">' +
      btn("Start a fresh week", "state=Sim.fresh();closePanel();welcome()") +
      btn("Keep this week", "closePanel()") +
      "</div>",
    "settings",
  );
}
function ending() {
  panel(
    '<div class="eyebrow">Seven days at Rookcross</div><h2>The door will open again.</h2>' +
      Sim.summary(state)
        .map((s) => "<p>" + esc(s) + "</p>")
        .join("") +
      '<div class="actions">' +
      btn("Read your journal", "journal()") +
      btn("Try another week", "confirmReset()") +
      btn("Look at the room", "closePanel()") +
      '</div><p class="muted">End of this vertical slice. Long-term romance, town simulation and construction belong to the future game.</p>',
    "ending",
  );
}
function interact() {
  if (state.paused || modal) return;
  let n = Sim.nearNpc(state),
    st = Sim.nearStation(state),
    e = state.evidence.find((e) => Sim.dist(e, state.player) < 65);
  if (n && state.player.carry) {
    doAct("serve", n.id);
    return;
  }
  if (e && e.id === "spill") {
    doAct("inspect", e.id);
    return;
  }
  if (st && (!n || Sim.dist(st, state.player) < Sim.dist(n, state.player))) {
    if (st.id === "board") board();
    else if (st.id === "bed") {
      if (!doAct("sleep")) {
        state.toast =
          "Closing comes near the end of the day. There is time to listen.";
        state.toastTime = 5;
      }
    } else if (st.id === "room" || st.id === "hearth") doAct("inspect", st.id);
    return;
  }
  if (n) talk(n.id);
}
window.addEventListener("keydown", (e) => {
  if (e.target.matches("input,select")) return;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key))
    e.preventDefault();
  let k = e.key.toLowerCase();
  if (!e.repeat) {
    if (k === " ") {
      if (modal !== "welcome" && !state.ended) pause();
      return;
    }
    if (k === "escape") {
      closePanel();
      return;
    }
    if (k === "j") {
      modal === "journal" ? closePanel() : journal();
      return;
    }
    if (k === "e") interact();
    if (k === "x" && !modal) doAct("discard");
  }
  keys[k] = true;
});
window.addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = false));
window.addEventListener("blur", () => {
  keys = {};
  if (started) state.paused = true;
  save();
});
canvas.addEventListener("pointerdown", (e) => {
  if (state.paused || modal) return;
  let r = canvas.getBoundingClientRect(),
    p = {
      x: ((e.clientX - r.left) * 1000) / r.width,
      y: ((e.clientY - r.top) * 660) / r.height,
    };
  if (!Sim.blocked(p.x, p.y)) state.player.path = Sim.route(state.player, p);
});
function rect(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(x, y, w, h);
}
function ellipse(x, y, rx, ry, c) {
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}
function text(t, x, y, size = 13, color = "#ddd1b5", align = "center") {
  ctx.font = `${size}px Georgia`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.fillText(t, x, y);
}
function bubble(t, x, y, color = "#d9d3b7") {
  ctx.font = "14px Georgia";
  let w = Math.min(370, ctx.measureText(t).width + 22);
  rect(x - w / 2, y - 22, w, 29, "#1d2b28ed");
  text(t, x, y - 3, 14, color);
}
function person(n, isPlayer = false) {
  TavernArt.person(ctx, n, isPlayer, state.time);
  if (n.id === "cedric" && state.quest?.outcome === "injured")
    rect(n.x - 9, n.y - 14, 18, 4, "#e8dbb5");
  ctx.save();
  const label = isPlayer ? state.player.name : n.name;
  ctx.font = "600 13px system-ui";
  const width = ctx.measureText(label).width + 16;
  ctx.fillStyle = isPlayer ? "#294744ed" : "#18272de8";
  ctx.beginPath();
  ctx.roundRect(n.x - width / 2, n.y + 16, width, 21, 6);
  ctx.fill();
  ctx.strokeStyle = isPlayer ? "#dcb579" : "#9f957866";
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.shadowColor = "#111a22";
  ctx.shadowBlur = 4;
  text(
    isPlayer ? state.player.name : n.name,
    n.x,
    n.y + 31,
    13,
    isPlayer ? "#ffe6ad" : "#f0dcc0",
  );
  ctx.restore();
}
function draw() {
  ctx.clearRect(0, 0, 1000, 660);
  TavernArt.room(ctx, state.time);
  text("OFFICE", 300, 58, 10, "#e4c494");
  text("GUEST ROOM", 838, 61, 10, "#e4c494");
  text("PRIVATE BOOTH", 832, 322, 10, "#c7c9aa");
  text("FRONT DOOR", 490, 641, 10, "#adbeae");
  text("BACK DOOR", 911, 218, 9, "#c6c6ad");
  for (const st of DATA.stations.filter((s) =>
    ["ale", "wine", "tea", "stew"].includes(s.id),
  ))
    text(st.id.toUpperCase(), st.x, st.y + 29, 10, "#e8c899");
  for (let e of state.evidence) {
    if (e.id === "spill") {
      ellipse(e.x, e.y, 21, 12, "#8b72a777");
      for (let j = 0; j < 4; j++)
        ellipse(e.x + j * 12, e.y - j * 7, 3, 2, "#987ca8");
    } else {
      rect(e.x - 10, e.y - 7, 20, 14, "#e9d6a7");
    }
  }
  for (let n of [
    ...state.npcs.filter((n) => n.present && Sim.line(state.player, n)),
    { ...state.player, isPlayer: true },
  ].sort((a, b) => a.y - b.y))
    person(n, n.isPlayer);
  let best = null;
  const attending = Sim.attendedTalk(state);
  for (let t of Sim.activeTalks(state)) {
    let p = Sim.perceive(state, t),
      n = Sim.npc(state, t.a),
      h = state.heard[t.id];
    if (p.tier === 1) {
      text(
        state.settings.clear ? "speaking" : "···",
        n.x,
        n.y - 46,
        state.settings.clear ? 13 : 18,
        "#e9dabc",
      );
    }
    if (p.tier === 2) bubble(t.fragment, n.x, n.y - 45);
    if (p.tier === 3) {
      text(t.whisper ? "…" : "···", n.x, n.y - 46, 20, "#ead6a5");
      if (t.id === attending?.id) best = { t, dwell: h?.dwell || 0 };
    }
  }
  $("caption").style.display = best ? "block" : "none";
  if (best)
    $("caption").textContent =
      best.dwell >= 3 ? best.t.line : best.t.fragment + " (linger nearby)";
  let near = Sim.nearNpc(state),
    st = Sim.nearStation(state);
  let hint = state.paused
    ? "PAUSED · inspect freely · Space to resume"
    : state.player.carry
      ? `Carrying ${state.player.carry} · E near a guest · X to set down`
      : near
        ? `E · Talk to ${near.name}`
        : st
          ? ["ale", "wine", "tea", "stew"].includes(st.id)
            ? `Hold E · Prepare ${st.id}`
            : `E · ${st.name}`
          : "Walk close. Listen a little longer.";
  $("interaction-hint").textContent = hint;
  if (state.pour > 0) {
    rect(state.player.x - 15, state.player.y + 36, 30, 3, "#272d28");
    rect(
      state.player.x - 15,
      state.player.y + 36,
      (30 * state.pour) / 0.65,
      3,
      "#e7c578",
    );
  }
  let phase =
    state.time < 35
      ? "Morning"
      : state.time < 110
        ? "Afternoon"
        : state.time < 145
          ? "Evening"
          : "Closing";
  $("status").innerHTML =
    `<span class="eyebrow">Day ${state.day} / 7 · ${phase}</span><div class="day-track" aria-hidden="true"><i style="width:${(100 * state.time) / 180}%"></i></div><span>${DATA.dayNames[state.day - 1]}</span> <strong class="coin-count">${state.coins} coins</strong>`;
  $("pause").textContent = state.paused ? "Resume" : "Pause";
  $("toast").textContent =
    state.toastTime > 0
      ? state.toast
      : state.staff.hired
        ? "Nell has the public tables. You have a little more room to listen."
        : "A warm room. Eight lives. You cannot be everywhere.";
  if (state.paused && modal !== "welcome") {
    rect(45, 45, 900, 571, "#15222330");
    text(state.ended ? "WEEK COMPLETE" : "PAUSED", 500, 312, 32, "#ffebbc");
  }
  if (modal) {
    for (let b of $("panel").querySelectorAll("button")) {
      if (/choice\(|dispatch\(/.test(b.getAttribute("onclick") || "")) {
        if (!("originalDisabled" in b.dataset))
          b.dataset.originalDisabled = String(b.disabled);
        b.disabled = state.paused || b.dataset.originalDisabled === "true";
      }
    }
  }
}
function frame(t) {
  let dt = Math.min(0.1, (t - last) / 1000 || 0);
  last = t;
  let wasEnded = state.ended;
  Sim.tick(
    state,
    dt,
    modal
      ? {}
      : {
          up: keys.w || keys.arrowup,
          down: keys.s || keys.arrowdown,
          left: keys.a || keys.arrowleft,
          right: keys.d || keys.arrowright,
          interact: keys.e,
        },
  );
  if (state.ended && !wasEnded) ending();
  autosave += dt;
  if (autosave > 8) {
    save();
    autosave = 0;
  }
  draw();
  requestAnimationFrame(frame);
}
welcome();
requestAnimationFrame(frame);

// Optional synthesized ambience; no downloads and no essential audio information.
let ambienceContext = null;
function toggleAmbience() {
  if (ambienceContext) {
    const playing = ambienceContext.state === "running";
    playing ? ambienceContext.suspend() : ambienceContext.resume();
    $("sound").textContent = playing ? "Sound off" : "Sound on";
    return;
  }
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  ambienceContext = new Audio();
  const ac = ambienceContext,
    buffer = ac.createBuffer(1, ac.sampleRate * 5, ac.sampleRate),
    data = buffer.getChannelData(0);
  let lastNoise = 0;
  for (let i = 0; i < data.length; i++) {
    lastNoise = (lastNoise + Math.random() * 0.035 - 0.0175) / 1.015;
    data[i] = lastNoise;
  }
  const noise = ac.createBufferSource(),
    filter = ac.createBiquadFilter(),
    gain = ac.createGain();
  noise.buffer = buffer;
  noise.loop = true;
  filter.type = "lowpass";
  filter.frequency.value = 950;
  gain.gain.value = 0.23;
  noise.connect(filter).connect(gain).connect(ac.destination);
  noise.start();
  for (let frequency of [146.83, 220, 293.66]) {
    const tone = ac.createOscillator(),
      volume = ac.createGain();
    tone.type = "sine";
    tone.frequency.value = frequency;
    volume.gain.value = 0.006;
    tone.connect(volume).connect(ac.destination);
    tone.start();
  }
  $("sound").textContent = "Sound on";
}
</script></body></html>
